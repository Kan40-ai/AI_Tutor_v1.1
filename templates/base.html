<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}Ethos AI - Intelligent Tutor{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  
  <body style="font-family: 'Inter', sans-serif; background-color: #F8FAFC; margin: 0; display: flex; flex-direction: column; height: 100vh;">
    
    <header class="app-header" style="background-color: #1E293B; color: white; padding: 15px 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 10;">
      <div style="font-size: 2rem;">🌐</div>
      <div>
        <h1 style="margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.5px;">Ethos AI</h1>
        <span style="font-size: 0.9rem; color: #94A3B8;">A Culturally Responsive & Trustworthy Learning Companion</span>
      </div>
    </header>

    <main class="app-main" style="flex: 1; overflow: hidden; display: flex;">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/chat.js') }}?v=2"></script>
  </body>
</html>
